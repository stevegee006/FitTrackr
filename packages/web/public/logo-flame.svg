<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#312e81" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Left plate -->
  <rect x="4" y="22" width="18" height="56" rx="5" fill="url(#plateGrad)" filter="url(#shadow)"/>
  <!-- Left collar -->
  <rect x="22" y="31" width="10" height="38" rx="3" fill="url(#barGrad)"/>
  <!-- Bar -->
  <rect x="32" y="38" width="36" height="24" rx="4" fill="url(#barGrad)" filter="url(#shadow)"/>
  <!-- Right collar -->
  <rect x="68" y="31" width="10" height="38" rx="3" fill="url(#barGrad)"/>
  <!-- Right plate -->
  <rect x="78" y="22" width="18" height="56" rx="5" fill="url(#plateGrad)" filter="url(#shadow)"/>

  <!-- Highlight lines on plates for depth -->
  <rect x="8" y="28" width="3" height="44" rx="1.5" fill="white" opacity="0.18"/>
  <rect x="82" y="28" width="3" height="44" rx="1.5" fill="white" opacity="0.18"/>
</svg>
