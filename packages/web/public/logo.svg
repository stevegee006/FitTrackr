<svg viewBox="-174 -86 348 172" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>FitTrackr</title>
  <!--
    Same geometry as the app icon in generate-icons.mjs (320-unit space): one
    continuous square-ended bar with the plates stacked on top, no knurling.
    This file renders on a transparent background in both light and dark mode,
    so it uses mid-tone indigo rather than the icon's pale tints — those are
    only legible against the icon's solid #4f46e5 tile.
  -->
  <g>
    <rect x="-128" y="-16" width="256" height="32"  fill="#6366f1"/>
    <rect x="-126" y="-76" width="48"  height="152" rx="7" fill="#4f46e5"/>
    <rect x="78"   y="-76" width="48"  height="152" rx="7" fill="#4f46e5"/>
    <rect x="-164" y="-52" width="38"  height="104" rx="7" fill="#818cf8"/>
    <rect x="126"  y="-52" width="38"  height="104" rx="7" fill="#818cf8"/>
  </g>
</svg>
